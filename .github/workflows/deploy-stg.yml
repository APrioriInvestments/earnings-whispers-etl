# Suffixed `.template` so GitHub ignores it here: this repo is the template, and a
# deploy from it would target a earnings-whispers-etl catalog that does not exist. `dbxkit init`
# strips the suffix.
name: deploy-stg

# Staging deploys from a pull request, so the bundle is applied to a real workspace
# before anything reaches main.

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  deploy-stg:
    runs-on: ubuntu-latest
    environment: earnings-whispers-etl-stg
    steps:
      # databricks.yml includes the shared monitoring job from the submodule, and the
      # default checkout token is scoped to this repo only, so a private submodule 404s.
      # This is the org's REPO_ACCESS app, the same one CI uses for private dependencies.
      - uses: actions/create-github-app-token@v3
        id: repo-access
        with:
          app-id: ${{ vars.REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.REPO_ACCESS_SECRET }}
          owner: APrioriInvestments
          repositories: databricks-monitoring

      - uses: actions/checkout@v6

      - name: Fetch the monitoring submodule
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/APrioriInvestments/".insteadOf "https://github.com/APrioriInvestments/"
          git submodule update --init --recursive
        env:
          TOKEN: ${{ steps.repo-access.outputs.token }}

      - uses: databricks/setup-cli@main

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: databricks bundle validate --strict -t stg
        env: &auth
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_CLIENT_ID }}

      - run: databricks bundle deploy -t stg
        env: *auth

      - name: Summarise
        run: databricks bundle summary -t stg >> "$GITHUB_STEP_SUMMARY"
        env: *auth
