bundle:
  name: earnings-whispers-etl

include:
  - resources/*.yml
  - vendor/databricks-monitoring/bundle/monitoring.job.yml

variables:
  catalog:
    description: Unity Catalog this target writes to. Owned by the platform plane.
  monitoring_job_name:
    description: Pushgateway job name, read by the shared monitoring job.
  deploy_principal:
    description: >-
      Application id of the service principal that deploys this bundle. Must match the
      DEPLOY_CLIENT_ID the platform plane publishes to this repo's GitHub Environment —
      it is the same identity, and root_path depends on it.

sync:
  exclude:
    - .github/**

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

targets:
  # Each `deploy_principal` below is that environment's DEPLOY_CLIENT_ID, from the
  # `earnings-whispers-<env>` GitHub Environment the registry created. They must stay in
  # step: `root_path` is derived from the principal, so a stale id silently writes a
  # second state file under the wrong user.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-42940436-10fd.cloud.databricks.com
      profile: dev
    variables:
      catalog: earnings_whispers_dev
      monitoring_job_name: earnings_whispers_etl
      deploy_principal: 9ae5541a-e33a-4851-b1cc-5d87b8a1d4ac
    presets:
      name_prefix: "[dev ${workspace.current_user.short_name}] "
      trigger_pause_status: PAUSED
      tags:
        project: demo
        managed_by: dabs

  stg:
    mode: production
    workspace:
      host: https://dbc-978d7462-8588.cloud.databricks.com
      root_path: /Workspace/Users/${var.deploy_principal}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: earnings_whispers_stg
      monitoring_job_name: earnings_whispers_etl
      deploy_principal: 93a43071-b78f-4a6a-882b-441557994cac
    presets:
      trigger_pause_status: UNPAUSED
      # Staging is the ticking environment here: it runs as a service principal in
      # no legacy groups, so it exercises the access model a dev run (as the engineer)
      # would hide. dbxkit lint treats an unpaused staging trigger as a warning.
      tags:
        project: demo
        managed_by: dabs

  prod:
    mode: production
    workspace:
      host: https://dbc-1d0b2bec-7527.cloud.databricks.com
      root_path: /Workspace/Users/${var.deploy_principal}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: earnings_whispers_prod
      monitoring_job_name: earnings_whispers_etl
      deploy_principal: df41ba10-6276-47cf-8408-31217af949c2
    presets:
      trigger_pause_status: PAUSED
      # Deliberately dormant: the prod secret scope exists but holds no api-key, so a
      # run here would fail. Unpause once someone adds it.
      tags:
        project: demo
        managed_by: dabs
