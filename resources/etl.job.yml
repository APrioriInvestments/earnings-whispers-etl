resources:
  jobs:
    etl:
      name: ${var.catalog}__etl
      description: Ingest the Earnings Whispers feed and rebuild silver.whisper_numbers
      max_concurrent_runs: 1
      queue:
        enabled: true

      webhook_notifications:
        on_failure:
          - id: ${var.alerts_destination}

      parameters:
        - name: full_refresh
          default: "false"
        - name: pin_suffix
          default: ""
        - name: audit_pipeline
          default: etl

      # Stated inline, deliberately, and driven by a per-target variable. `mode:
      # development` force-pauses schedules and DABs refuses `trigger_pause_status:
      # UNPAUSED` under it, so a preset cannot make dev tick; an inline value can,
      # because presets fill gaps and never override one.
      #
      # This trips `bundle-pause-status-inline`, knowingly. Ticking in dev is the point:
      # the feed is snapshot-only with no history endpoint, so a day nothing runs is
      # permanently lost. Revert to the preset once stg or prod is the ticking
      # environment.
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: America/New_York
        pause_status: ${var.schedule_pause_status}

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: r5d.xlarge
            kind: CLASSIC_PREVIEW
            is_single_node: true
            runtime_engine: PHOTON
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
            cluster_log_conf:
              volumes:
                destination: /Volumes/${var.catalog}/eng/logs
            spark_env_vars:
              # Environment is a property of the workspace, so one value is correct on any
              # cluster here. `constants.DEFAULT_CATALOG` derives the catalog from it.
              DEPLOY_ENV: ${bundle.target}
              # The synced pins file for this target, rather than a copy on a volume.
              EARNINGS_WHISPERS_ETL_PINS_CONFIG: ${workspace.file_path}/pins/pins.${bundle.target}.yaml
              # No GITHUB_TOKEN. The private packages in cluster_requirements.txt install
              # from the wheel store on a volume, so nothing is cloned while a cluster
              # boots and GitHub is out of the critical path of a cluster start.

      tasks:
        - task_key: bronze_ingest_whispers
          job_cluster_key: etl_cluster
          libraries: &libs
            - requirements: ${workspace.file_path}/cluster_requirements.txt
            - whl: ../dist/*.whl
          notebook_task:
            notebook_path: ../earnings_whispers_etl/bronze/ingest_whispers.py
            base_parameters: &audit
              full_refresh: "{{job.parameters.full_refresh}}"
              pin_suffix: "{{job.parameters.pin_suffix}}"
              audit_pipeline: "{{job.parameters.audit_pipeline}}"
              audit_task_key: "{{task.name}}"
              audit_notebook_path: "{{task.notebook_path}}"
          # A missed day is unrecoverable -- the API has no history endpoint -- so retry
          # transient failures rather than losing the pull.
          max_retries: 3
          min_retry_interval_millis: 600000

        - task_key: silver_whisper_numbers
          depends_on:
            - task_key: bronze_ingest_whispers
          job_cluster_key: etl_cluster
          libraries: *libs
          notebook_task:
            notebook_path: ../earnings_whispers_etl/silver/build_whisper_numbers.py
            base_parameters: *audit
          max_retries: 2
          min_retry_interval_millis: 300000
