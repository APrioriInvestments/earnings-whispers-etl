resources:
  jobs:
    etl:
      name: ${var.catalog}__etl
      description: Template bronze -> silver -> gold ETL for product data
      max_concurrent_runs: 1
      queue:
        enabled: true

      webhook_notifications:
        on_failure:
          - id: ${var.alerts_destination}

      parameters:
        - name: full_refresh
          default: "false"
        - name: pin_suffix
          default: ""
        - name: audit_pipeline
          default: etl

      # No pause_status: each target's `trigger_pause_status` preset sets it, and a value
      # here would win over the preset.
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/New_York

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: r5d.xlarge
            kind: CLASSIC_PREVIEW
            is_single_node: true
            runtime_engine: PHOTON
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
            cluster_log_conf:
              volumes:
                destination: /Volumes/${var.catalog}/eng/logs
            spark_env_vars:
              # Environment is a property of the workspace, so one value is correct on any
              # cluster here. `constants.DEFAULT_CATALOG` derives the catalog from it.
              DEPLOY_ENV: ${bundle.target}
              # The synced pins file for this target, rather than a copy on a volume.
              EARNINGS_WHISPERS_ETL_PINS_CONFIG: ${workspace.file_path}/pins/pins.${bundle.target}.yaml
              # No GITHUB_TOKEN. The private packages in cluster_requirements.txt install
              # from the wheel store on a volume, so nothing is cloned while a cluster
              # boots and GitHub is out of the critical path of a cluster start.

      tasks:
        - task_key: bronze_ingest_products
          job_cluster_key: etl_cluster
          libraries: &libs
            - requirements: ${workspace.file_path}/cluster_requirements.txt
            - whl: ../dist/*.whl
          notebook_task:
            notebook_path: ../earnings_whispers_etl/bronze/ingest_products.py
            base_parameters: &audit
              full_refresh: "{{job.parameters.full_refresh}}"
              pin_suffix: "{{job.parameters.pin_suffix}}"
              audit_pipeline: "{{job.parameters.audit_pipeline}}"
              audit_task_key: "{{task.name}}"
              audit_notebook_path: "{{task.notebook_path}}"

        - task_key: silver_update_products
          depends_on:
            - task_key: bronze_ingest_products
          job_cluster_key: etl_cluster
          libraries: *libs
          notebook_task:
            notebook_path: ../earnings_whispers_etl/silver/update_silver_products.py
            base_parameters: *audit

        - task_key: gold_update_category_summary
          depends_on:
            - task_key: silver_update_products
          job_cluster_key: etl_cluster
          libraries: *libs
          notebook_task:
            notebook_path: ../earnings_whispers_etl/gold/update_gold_category_summary.py
            base_parameters: *audit
